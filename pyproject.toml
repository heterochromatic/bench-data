[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-data"
version = "0.1.0"
description = "Build benchmark inputs and candidate answer keys from free, first-hand public records"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
bench-data = "benchdata.build:main"

[tool.setuptools]
packages = ["benchdata"]
